{% extends "base.html" %}
{% block content %}
  <div class="panel-login">
    <div class="head-page"><div>
      <h1>Log in</h1>
      <p class="head-page-lede">The Office of Institutional Research's console, for the Director and Analysts.</p>
    </div></div>
    {% if error %}<p class="alert-console" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <p class="field-console"><label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required autocomplete="username"></p>
      <p class="field-console"><label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password"></p>
      <button class="button-primary" type="submit">Log in</button>
    </form>
  </div>
{% endblock %}
