{% extends "base.html" %}
{% block content %}
  <h1>Admin console</h1>
  <p>Signed in as {{ user.email }} ({{ user.role | role_label }}).</p>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <button type="submit">Log out</button>
  </form>
{% endblock %}
